name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # « lock » installe exactement les versions de composer.lock (Symfony 7.4).
        # « 6.4 » ne rétrograde que les composants Symfony requis, en version figée :
        # la CI ne doit jamais récupérer une dépendance publiée la veille.
        symfony: ['lock', '6.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies from lock file
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Downgrade Symfony components to 6.4
        if: matrix.symfony == '6.4'
        run: >
          composer update --no-interaction --no-progress
          symfony/console symfony/finder symfony/http-client symfony/yaml
          symfony/framework-bundle symfony/http-kernel
          --with symfony/console:6.4.49
          --with symfony/finder:6.4.49
          --with symfony/http-client:6.4.49
          --with symfony/yaml:6.4.49
          --with symfony/framework-bundle:6.4.49
          --with symfony/http-kernel:6.4.49

      - name: PHPStan
        run: vendor/bin/phpstan analyse src --level=8

      - name: PHPUnit
        run: vendor/bin/phpunit

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies from lock file
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan level 8
        run: vendor/bin/phpstan analyse src --level=8

      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

      - name: Coverage threshold (80 %)
        run: php .github/scripts/check-coverage.php coverage.xml 80

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
