name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create release with PHAR
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          ini-values: phar.readonly=0

      - name: Validate composer.json
        run: composer validate --strict

      - name: Build PHAR
        run: |
          sh .github/scripts/prepare-dist.sh "$RUNNER_TEMP/dist"
          php .github/scripts/build-phar.php "$RUNNER_TEMP/dist" sylius-upgrade-analyzer.phar
          php sylius-upgrade-analyzer.phar --version
          sha256sum sylius-upgrade-analyzer.phar > sylius-upgrade-analyzer.phar.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            sylius-upgrade-analyzer.phar
            sylius-upgrade-analyzer.phar.sha256

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push to GitHub Container Registry
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$VERSION" --version
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
